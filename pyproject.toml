[project]
name = "pressure-index"
version = "1.0.0"
description = "Who performs when the match is on the line? Win-probability, run-expectancy and shrinkage models over 600k+ T20 deliveries."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
  "scikit-learn>=1.5",
  "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
pressure-index = "pressure_index.__main__:cli"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = { find = { include = ["pressure_index*"] } }

[tool.setuptools.package-data]
pressure_index = ["config.toml"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "E731", "B023", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
